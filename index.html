<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SL Makitshi | Portfolio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="nav" id="nav">
  <a href="#top" class="nav__mark">SLM</a>
  <button class="nav__toggle" id="navToggle" aria-label="Menu" aria-expanded="false">
    <span></span><span></span>
  </button>
  <nav class="nav__links" id="navLinks">
    <a href="#work">Work</a>
    <a href="#measurements">Measurements</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<main id="top">
    <!-- HERO -->
    <section class="hero">
    <h1 class="hero__name">
        <span>Siphe</span>
        <span>Lazola</span>
        <span class="hero__name--outline">Makitshi</span>
    </h1>
    <p class="hero__tag">Developing Software by day. Fashion Model by ambition. Based in Johannesburg.</p>
    <div class="hero__frame">
        <img src="" alt="Close up image of Siphe">
        <span class="hero__frame-label">Portrait 01</span>
    </div>
    <a class="hero__scroll" href="#work">See the work</a>
    </section>

    <!-- Measurements -->
  <section class="stats" id="stats">
    <div class="stats__row">
      <div class="stat"><span class="stat__value">185</span><span class="stat__unit">cm</span><span class="stat__label">Height</span></div>
      <div class="stat"><span class="stat__value">94</span><span class="stat__unit">cm</span><span class="stat__label">Chest</span></div>
      <div class="stat"><span class="stat__value">74</span><span class="stat__unit">cm</span><span class="stat__label">Waist</span></div>
      <div class="stat"><span class="stat__value">UK 9</span><span class="stat__unit"></span><span class="stat__label">Shoe</span></div>
      <div class="stat"><span class="stat__value">Brown</span><span class="stat__unit"></span><span class="stat__label">Eyes</span></div>
      <div class="stat"><span class="stat__value">Black</span><span class="stat__unit"></span><span class="stat__label">Hair</span></div>
    </div>
  </section>

</main>

<footer class="footer">
</footer>

<script src="script.js"></script>
</body>
</html>
